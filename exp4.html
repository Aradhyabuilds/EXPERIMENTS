<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>
      <center><legend><h1>Hotel Room Booking Form</h1></legend>
      </center>
     <center> <label for=" fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname"><br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone"><br><br>
      <label for="checkin">Check-in Date:</label>
      <input type="date" id="checkin" name="checkin"><br><br>
      <label for="checkout">Check-out Date:</label>
      <input type="date" id="checkout" name="checkout"><br><br>
      <label for="roomtype">Room Type:</label>
      <select id="roomtype" name="roomtype">
        <option value="single">Single</option>
        <option value="double">Double</option>
        <option value="suite">Suite</option></select> <br><br>
      
      
      <label for="number">Number of Guests:</label>
      <input type="number" id="guests" name="guests"><br><br>
      <label for="specialrequests">Special Requests:</label><br>
      <textarea id="specialrequests" name="specialrequests"></textarea><br><br>
     
      <input type="BookNow">
      <input type="Reset">
    </fieldset>
     </center>
</body>
</html>
